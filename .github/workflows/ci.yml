name: AI Symptom Checker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.14.8'

      - name: Install Ansible
        run: |
          python -m pip install ansible-core

      - name: Terraform format and validation
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Ansible syntax check
        run: |
          ansible-playbook --syntax-check ansible/deploy.yml

      - name: Generate Data & Train Model
        run: |
          python3 data/generate_dataset.py
          python3 ml_model/train.py

      - name: Execute Automated Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t ai-symptom-checker:latest .
