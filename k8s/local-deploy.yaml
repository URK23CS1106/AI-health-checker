apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-symptom-checker
  template:
    metadata:
      labels:
        app: ai-symptom-checker
    spec:
      containers:
      - name: main-app
        # We will build this image locally as 'ai-symptom-checker:latest'
        image: ai-symptom-checker:latest
        imagePullPolicy: Never # Critical for local setup: use the local image
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-checker-service
spec:
  type: NodePort
  selector:
    app: ai-symptom-checker
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    nodePort: 30000 # Access via http://localhost:30000
